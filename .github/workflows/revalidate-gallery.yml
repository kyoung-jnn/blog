name: Revalidate gallery

# Manual trigger only — fire from GitHub Actions UI or `gh workflow run`.
# Required repo secrets:
#   - SITE_URL              e.g. https://kyoung-jnn.com  (no trailing slash)
#   - REVALIDATE_SECRET     same value as the deployed env var
on:
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/revalidate-gallery
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ] || [ -z "${REVALIDATE_SECRET}" ]; then
            echo "::error::SITE_URL or REVALIDATE_SECRET secret is not set"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/revalidate-gallery?secret=${REVALIDATE_SECRET}")
          echo "HTTP ${response}"
          cat /tmp/body.json
          echo
          if [ "${response}" -ne 200 ]; then
            echo "::error::revalidate failed with HTTP ${response}"
            exit 1
          fi
